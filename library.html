<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cultigen 课程库</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#fbf5e6;--card:#fffdf7;--ink:#3b352a;--ink2:#6f6653;--line:#e6dcc0;--coral:#d5643c;--forest:#5c8a4a}
  *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);
    font:16px/1.6 "Hanken Grotesk",system-ui,sans-serif}
  .gate{max-width:420px;margin:16vh auto;padding:32px;text-align:center}
  .gate h1{font-family:"Bricolage Grotesque",serif;font-size:1.6rem;margin:0 0 6px}
  .gate p{color:var(--ink2);margin:0 0 20px}
  .gate input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;text-align:center}
  .gate button{margin-top:12px;width:100%;padding:12px;border:none;border-radius:100px;background:var(--coral);color:#fff;font-weight:800;cursor:pointer}
  .gate .err{color:#b23b3b;font-size:.9rem;margin-top:10px;min-height:1.2em}
  #lib{display:none;max-width:960px;margin:0 auto;padding:34px 24px 90px}
  header.lib h1{font-family:"Bricolage Grotesque",serif;font-size:2rem;margin:0 0 6px}
  header.lib .sub{color:var(--ink2)}
  .courses{display:grid;gap:22px;margin-top:24px}
  .course{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px}
  .chead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .chead h2{font-family:"Bricolage Grotesque",serif;font-size:1.2rem;margin:0}
  .status{font-size:.72rem;font-weight:700;color:var(--forest);background:#dcecc0;padding:3px 10px;border-radius:100px;white-space:nowrap}
  .src{font-size:.85rem;color:var(--ink2);margin:.6em 0}
  .src a{color:var(--forest)} .sum{margin:.4em 0}
  .tags{margin:.6em 0} .chip{display:inline-block;font-size:.72rem;color:var(--ink2);background:#f1ead7;border:1px solid var(--line);padding:3px 9px;border-radius:100px;margin:0 6px 6px 0}
  .outs{font-size:.85rem;color:var(--ink2);margin:.3em 0 .7em}
  details{margin:.5em 0} summary{cursor:pointer;font-weight:700;color:var(--coral)}
  iframe{width:100%;height:520px;border:1.5px solid var(--line);border-radius:12px;margin-top:12px;background:#fff}
  .adoption{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .adoption h3{font-family:"Bricolage Grotesque",serif;font-size:.95rem;margin:0 0 8px}
  .adopt{margin:0;padding-left:18px} .adopt li{margin:.4em 0;font-size:.9rem}
  .fb{color:var(--ink2)} .none{color:var(--ink2);font-size:.9rem;margin:0}
</style>
</head>
<body>
  <div class="gate" id="gate">
    <h1>Cultigen 课程库</h1>
    <p>请输入密码查看</p>
    <input id="pw" type="password" placeholder="密码" autofocus>
    <button id="go">进入</button>
    <div class="err" id="err"></div>
  </div>
  <div id="lib"></div>

const ITER = 150000;
const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const [sB, iB, cB] = BLOB.split(":");
  const salt = dec(sB), iv = dec(iB), ct = dec(cB);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"}, km,
    {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return new TextDecoder().decode(pt);
}

async function go(){
  const pw = document.getElementById("pw").value;
  document.getElementById("err").textContent = "";
  try{
    const html = await unlock(pw);
    document.getElementById("lib").innerHTML = html;
    document.getElementById("gate").style.display = "none";
    document.getElementById("lib").style.display = "block";
  }catch(e){
    document.getElementById("err").textContent = "密码错误";
  }
}
document.getElementById("go").addEventListener("click", go);
document.getElementById("pw").addEventListener("keydown", e => { if(e.key==="Enter") go(); });
